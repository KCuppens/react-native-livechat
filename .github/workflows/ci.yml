name: CI
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repo (it also runs PR code).
permissions:
  contents: read

# Superseded pushes to the same ref cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (tags can be moved).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      # Bundles the Worker and validates wrangler.jsonc (assets, DOs, queues, rate limits) without
      # credentials, so deploy-breaking config shows up on the PR instead of at deploy time.
      - run: pnpm --filter @livechat/worker exec wrangler deploy --dry-run --outdir=dist-check
