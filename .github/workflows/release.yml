name: Release
# Runs only after CI succeeded on main, so nothing that failed lint/typecheck/tests is published or deployed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Read-only by default; only the release job gets write scopes.
permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    outputs:
      stale: ${{ steps.tip.outputs.stale }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # changesets/action pushes the version branch itself, so the token stays in the checkout here.
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      # changesets/action works from the tip of main, not from the commit CI checked. If newer
      # commits landed since, skip: their own CI run triggers their own release run.
      - name: Check that the CI-checked commit is still the tip of main
        id: tip
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::notice title=Release skipped::${{ github.event.workflow_run.head_sha }} is no longer the tip of main; the tip's own CI run releases and deploys it."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.tip.outputs.stale != 'true'
      # Opens a "Version packages" PR from pending changesets; publishes to npm when that PR is merged.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        if: steps.tip.outputs.stale != 'true'
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's .npmrc reads NODE_AUTH_TOKEN; without it publish uses a placeholder and fails.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  deploy-worker:
    needs: release
    # A stale run must not deploy an older commit after (or racing) the newer commit's own run.
    if: ${{ vars.DEPLOY_WORKER == 'true' && needs.release.outputs.stale != 'true' }}
    runs-on: ubuntu-latest
    # Protection rules (required reviewers, branch restrictions) and the Cloudflare secrets live
    # on this GitHub environment.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { ref: "${{ github.event.workflow_run.head_sha }}", persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Refuse to deploy the placeholder database id
        run: "! grep -q '00000000-0000-0000-0000-000000000000' apps/worker/wrangler.jsonc || (echo 'Set the real D1 database_id in apps/worker/wrangler.jsonc' && exit 1)"
      - run: pnpm --filter @livechat/worker... build
      # Cloudflare secrets only on the steps that need them, not on install/build (dependency scripts).
      - run: pnpm --filter @livechat/worker exec wrangler d1 migrations apply livechat --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter @livechat/worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
